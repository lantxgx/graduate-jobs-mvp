<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手动录入 · 应届生招聘雷达</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<header class="page-header"><nav class="nav"><a class="brand" href="/">Graduate Radar</a><div class="nav-links"><a class="nav-link" href="/">找岗位</a><a class="nav-link" href="/admin/sources">数据管理</a><a class="nav-link active" href="/admin/manual">手动录入</a></div></nav></header>
<main><section class="page-intro admin-intro"><p class="eyebrow dark">MANUAL INGESTION</p><h1>开发者手动录入岗位</h1><p>只填写官方详情页原文。提交后使用与自动采集相同的标准化和质量门禁。</p></section>
<section class="directory-panel standalone-panel"><form id="manualForm" class="source-filters" autocomplete="off"><label>企业名称<input required name="company" placeholder="如：海康威视"></label><label>岗位名称<input required name="title" placeholder="如：算法工程师"></label><label>国家<input required name="country" value="中国"></label><label>省份<input required name="province" placeholder="如：浙江省"></label><label>城市<input required name="city" placeholder="如：杭州市"></label><label>职能<select required name="category"><option value="">请选择</option><option>算法/AI</option><option>软件/开发</option><option>硬件/嵌入式</option><option>测试/质量</option><option>产品</option><option>运营</option><option>设计</option><option>市场/销售</option><option>职能/供应链</option><option>其他</option></select></label><label>专业要求<input required name="major" placeholder="如：计算机、数学等"></label><label>招聘类型<select required name="job_nature"><option value="">请选择</option><option>全职</option><option>实习</option></select></label><label>学历要求<select required name="degree"><option value="">请选择</option><option>博士</option><option>硕士</option><option>本科</option><option>大专</option><option>学历不限</option><option>其他（按原文填写）</option></select></label><label>应届年份<input name="graduate_year" placeholder="如：2027"></label><label>发布时间<input type="date" name="published_at"></label><label>来源岗位 ID<input name="source_job_id" placeholder="详情页中的岗位编号"></label><label>来源标识<input name="source_id" placeholder="留空自动生成"></label><label class="wide">任职要求<textarea required name="requirements" rows="5"></textarea></label><label class="wide">岗位职责<textarea required name="description" rows="5"></textarea></label><label>官方投递链接<input required type="url" name="apply_url" placeholder="https://..."></label><label>官方招聘来源<input required type="url" name="source_url" placeholder="https://..."></label><div class="wide"><button class="primary-button" type="submit">提交并入库</button><button class="secondary-button" type="reset">清空</button></div></form><p id="manualResult" class="admin-summary"></p></section></main><script src="/static/admin-manual.js?v=2"></script></body></html>
