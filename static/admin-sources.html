<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>数据管理 · 应届生招聘雷达</title><link rel="stylesheet" href="/static/styles.css" /></head>
<body>
  <header class="page-header"><nav class="nav" aria-label="主导航"><a class="brand" href="/">Graduate Radar</a><div class="nav-links"><a class="nav-link" href="/">找岗位</a><a class="nav-link" href="/profile">我的画像</a><a class="nav-link active" href="/admin/sources">数据管理</a></div><div class="badge">采集控制面</div></nav></header>
  <main>
    <section class="page-intro admin-intro"><p class="eyebrow dark">SOURCE CONTROL PLANE</p><h1>企业与岗位数据管理</h1><p>这里维护官方招聘入口、接入质量和采集运行。页面加载不会自动访问任何招聘官网。</p></section>
    <section class="directory-panel standalone-panel"><div class="quality-grid"><div><strong id="sourceCompanies">0</strong><span>企业</span></div><div><strong id="sourceCount">0</strong><span>去重入口</span></div><div><strong id="highQuality">0</strong><span>高质量入口</span></div><div><strong id="blockedSources">0</strong><span>阻断/异常</span></div></div><p id="sourceSummary" class="admin-summary">正在加载入口状态…</p><form id="sourceFilters" class="source-filters" autocomplete="off"><label>企业关键词<input id="filterCompany" name="company" placeholder="如：小米 / OPPO" /></label><label>招聘系统<select id="filterAts" name="ats_type"><option value="">全部系统</option><option value="beisen">北森</option><option value="feishu">飞书招聘</option><option value="self_hosted">企业自建</option><option value="other">其他</option></select></label><label>官方状态<select id="filterOfficial" name="official_status"><option value="">全部状态</option><option value="confirmed">已确认官方</option><option value="candidate">候选待验证</option><option value="unverified">未验证</option><option value="excluded">已排除</option></select></label><label>访问状态<select id="filterAccess" name="access_status"><option value="">全部状态</option><option value="reachable">可访问</option><option value="access_error">访问异常</option><option value="unknown">未知</option></select></label><label>接入状态<select id="filterIntegration" name="integration_status"><option value="">全部状态</option><option value="integrated">已接入</option><option value="analyzing">分析中</option><option value="not_integrated">未接入</option><option value="blocked">已阻断</option></select></label><label>质量<select id="filterQuality" name="quality_level"><option value="">全部质量</option><option value="high">高质量</option><option value="medium">中质量</option><option value="low">低质量</option><option value="blocked">阻断</option></select></label><button type="submit" class="primary-button">筛选</button><button type="button" id="resetSourceFilters" class="secondary-button">重置</button></form><p id="sourceResultCount" class="admin-summary">—</p><div class="source-table-wrap"><table class="source-table"><thead><tr><th>企业</th><th>招聘系统</th><th>官方性</th><th>访问</th><th>接入</th><th>质量</th><th>优先级</th><th>最近成功</th><th>下次运行</th><th>暂停原因</th><th>入口</th></tr></thead><tbody id="sourceRows"></tbody></table></div></section>
    <section class="admin-grid"><article class="directory-panel"><div class="results-head"><h2>待接入队列</h2></div><div id="ingestionQueue" class="admin-list">加载中…</div></article><article class="directory-panel"><div class="results-head"><h2>岗位质量</h2></div><pre id="jobQuality" class="admin-json">加载中…</pre></article><article class="directory-panel"><div class="results-head"><h2>最近采集运行</h2></div><div id="crawlRuns" class="admin-list">加载中…</div></article></section>
    <section class="directory-panel standalone-panel"><div class="results-head"><h2>岗位隔离证据</h2></div><div id="jobQuarantine" class="admin-list">加载中…</div></section>
  </main>
  <script src="/static/admin-sources.js?v=20260819-1"></script>
</body>
</html>
